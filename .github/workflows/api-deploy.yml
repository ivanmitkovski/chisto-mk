name: API image build

on:
  workflow_dispatch:
  push:
    # infra-migration is temporary, for the VPS bring-up: it lets an edit to this
    # file be its own trigger (the path filter below already covers it). Remove
    # the branch before merge.
    branches: [develop, main, infra-migration]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-deploy.yml'

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/${{ github.repository_owner }}/chisto-api

permissions:
  contents: read
  # Required to push to GHCR. The job's own GITHUB_TOKEN is enough for the push
  # and expires with the run; the VPS pulls with a separate read-only PAT.
  packages: write

# The ECR push, ECS migrate, ECS rollout, cosign and post-deploy verify jobs were
# removed with the AWS stack. What replaces them is platform-independent: build the
# production image, publish it to GHCR, and prove the published artifact boots.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # The deploy job pins to this, not to a tag.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # sha-<short> is immutable and is what the VPS pins to; the branch tag
          # is a convenience for humans and must not be deployed from.
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # linux/amd64 only: the runner and the VPS are both x86_64, so this is the
      # native path and no emulation is involved.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build is slow by nature — `pnpm deploy --prod --legacy` runs twice
          # and the API pass alone is ~205s — so an unwarmed build is minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deliberately tests the *pulled* image rather than a local build artifact:
      # it exercises the registry round-trip and proves the exact bytes the VPS
      # will run. Pinned by digest, so it cannot drift from what was just pushed.
      - name: Smoke health (no DB)
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          docker run -d --name api-smoke \
            -e NODE_ENV=test \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/db \
            -e JWT_SECRET=01234567890123456789012345678901 \
            -e SKIP_MIGRATE_STATUS_CHECK=1 \
            -p 3099:3000 \
            "$IMAGE_REF"
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3099/health >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::GET /health did not return 200 within 60s"
            docker logs api-smoke 2>&1 || true
            docker rm -f api-smoke
            exit 1
          fi
          docker rm -f api-smoke

      # The value to paste into API_IMAGE in the VPS .env.
      - name: Summary
        run: |
          {
            echo '### Image published'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Auto-deploys on infra-migration only — that is the rehearsal box, and the
  # branch is temporary anyway. develop and main deliberately do not deploy: after
  # merge this condition is what you revisit, deciding then whether a push to main
  # should reach production on its own.
  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/infra-migration'
    runs-on: ubuntu-latest
    # No `environment:` — creating one needs repo admin, which the person doing
    # this migration does not have. The cost is that these secrets are repo-wide
    # rather than scoped to this job, and there is no approval gate. Fork PRs
    # still cannot read them: GitHub withholds secrets from fork-triggered runs,
    # which is the exposure that would actually matter on a public repo.
    # Worth revisiting as an environment if admin becomes available.
    concurrency:
      group: api-deploy-vps
      cancel-in-progress: false
    steps:
      # The whole deploy is one ssh call. The box's authorized_keys pins this key
      # to infra/deploy/chisto-deploy.sh as a forced command, so the ref below
      # arrives as SSH_ORIGINAL_COMMAND and the script re-validates it — nothing
      # here can ask the box to run anything else.
      - name: Deploy to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no: without it the
          # first connection trusts whatever answers, which is the one moment a
          # deploy key is worth stealing.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" "$IMAGE_REF"

      - name: Summary
        if: always()
        run: |
          {
            echo '### VPS deploy'
            echo
            echo '`'"${{ env.IMAGE }}@${{ needs.build.outputs.digest }}"'`'
            echo
            echo "Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
